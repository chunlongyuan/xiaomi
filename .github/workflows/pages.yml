name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/kids-learning-web-app-6jgh0c
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache generated audio
        uses: actions/cache@v4
        with:
          path: audio
          key: audio-v1-${{ hashFiles('scripts/audio-phrases.json', 'scripts/gen-audio.py') }}

      - name: Generate TTS audio (if not cached)
        continue-on-error: true
        run: |
          pip install --quiet edge-tts
          python scripts/gen-audio.py

      - name: Cache-bust static assets with commit SHA
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const V = (process.env.GITHUB_SHA || "dev").slice(0, 8);
            function walk(dir){
              for(const f of fs.readdirSync(dir)){
                if(f.startsWith(".")) continue;
                const p = path.join(dir, f);
                const st = fs.statSync(p);
                if(st.isDirectory()) walk(p);
                else if(/\.(js|html|css)$/.test(f)){
                  let s = fs.readFileSync(p, "utf8");
                  // import ... from "./x.js"
                  s = s.replace(/((?:from|import)\s*[\x22\x27])((?:\.{1,2}\/)?[\w\-\/.]+\.(?:js|json))([\x22\x27])/g, (m,a,b,c)=> `${a}${b}?v=${V}${c}`);
                  // <link href="./x.css"> / <script src="./x.js">
                  s = s.replace(/(href|src)=([\x22\x27])((?:\.{1,2}\/)?[\w\-\/.]+\.(?:js|css))([\x22\x27])/g, (m,a,q,b,r)=> `${a}=${q}${b}?v=${V}${r}`);
                  // new URL("./data.json", import.meta.url)
                  s = s.replace(/new URL\(\s*[\x22\x27]((?:\.{1,2}\/)?[\w\-\/.]+\.(?:json|js|css))[\x22\x27]/g, (m,b)=> `new URL(\x22${b}?v=${V}\x22`);
                  fs.writeFileSync(p, s);
                }
              }
            }
            walk(".");
            console.log("Cache-busted assets with v=" + V);
          '

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
